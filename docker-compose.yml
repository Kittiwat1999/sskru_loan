services:

  nginx:
    image: nginx:alpine

    container_name: laravel_nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - laravel

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: laravel_mysql

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:latest

    container_name: laravel_phpmyadmin

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8080:80"

    depends_on:
      - mysql

    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data: